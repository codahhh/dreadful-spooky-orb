<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#07040f"/>
      <stop offset="42%" stop-color="#110826"/>
      <stop offset="72%" stop-color="#1b0a34"/>
      <stop offset="100%" stop-color="#05030b"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d9c6ff" stop-opacity=".75"/>
      <stop offset="30%" stop-color="#9b5cff" stop-opacity=".45"/>
      <stop offset="62%" stop-color="#5b21b6" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#2a0a4d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbGrad" cx="34%" cy="28%" r="78%">
      <stop offset="0" stop-color="#fff8ff"/>
      <stop offset="18%" stop-color="#e2c9ff"/>
      <stop offset="42%" stop-color="#a875ff"/>
      <stop offset="72%" stop-color="#5b21b6"/>
      <stop offset="100%" stop-color="#180733"/>
    </radialGradient>
    <radialGradient id="orbRim" cx="50%" cy="50%" r="50%">
      <stop offset="78%" stop-color="#c4a4ff" stop-opacity="0"/>
      <stop offset="93%" stop-color="#c9b0ff" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity=".1"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cf5e0" stop-opacity=".9"/>
      <stop offset="45%" stop-color="#a78bfa" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity=".15"/>
    </linearGradient>
    <linearGradient id="fog" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#3b0f6b" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#3b0f6b" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vig" cx="50%" cy="48%" r="70%">
      <stop offset="45%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity=".72"/>
    </radialGradient>
    <filter id="soft1" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="soft2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="soft3" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>

  <rect width="1600" height="900" fill="url(#space)"/>
  <ellipse cx="800" cy="440" rx="620" ry="420" fill="url(#aura)" filter="url(#soft1)" opacity=".85"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="140" cy="120" r="1.6" opacity=".7"/><circle cx="320" cy="240" r="1.2" opacity=".5"/>
    <circle cx="220" cy="640" r="1.4" opacity=".55"/><circle cx="430" cy="120" r="1" opacity=".45"/>
    <circle cx="1180" cy="150" r="1.5" opacity=".6"/><circle cx="1350" cy="330" r="1.1" opacity=".45"/>
    <circle cx="1260" cy="700" r="1.6" opacity=".5"/><circle cx="980" cy="90" r="1" opacity=".4"/>
    <circle cx="560" cy="760" r="1.2" opacity=".45"/><circle cx="1460" cy="600" r="1.3" opacity=".45"/>
    <circle cx="720" cy="150" r="1" opacity=".35"/><circle cx="90" cy="380" r="1.2" opacity=".4"/>
  </g>

  <!-- fog -->
  <ellipse cx="800" cy="820" rx="760" ry="190" fill="url(#fog)" filter="url(#soft2)"/>

  <!-- planetary ring behind -->
  <g transform="translate(800 470) rotate(-16)">
    <ellipse cx="0" cy="0" rx="430" ry="104" fill="none" stroke="url(#ring)" stroke-width="14" opacity=".5" filter="url(#soft2)"/>
    <ellipse cx="0" cy="0" rx="500" ry="126" fill="none" stroke="url(#ring)" stroke-width="3" opacity=".35"/>
  </g>

  <!-- the orb -->
  <g transform="translate(800 470)">
    <circle cx="0" cy="0" r="250" fill="url(#orbGrad)"/>
    <circle cx="0" cy="0" r="250" fill="url(#orbRim)"/>
    <ellipse cx="-70" cy="-96" rx="86" ry="58" fill="#ffffff" opacity=".28" filter="url(#soft2)" transform="rotate(-22)"/>
    <circle cx="0" cy="0" r="250" fill="none" stroke="#b79bff" stroke-opacity=".28" stroke-width="1.5"/>
    <g opacity=".5" filter="url(#soft3)">
      <path d="M-190 -60 C -120 -20, -80 30, -30 120" stroke="#e9dcff" stroke-width="2" fill="none" opacity=".5"/>
      <path d="M-150 90 C -60 60, 30 80, 120 140" stroke="#d9c6ff" stroke-width="1.6" fill="none" opacity=".4"/>
    </g>
  </g>

  <!-- planetary ring in front -->
  <g transform="translate(800 470) rotate(-16)">
    <path d="M-500 0 A 500 126 0 0 0 500 0" fill="none" stroke="url(#ring)" stroke-width="16" opacity=".85" filter="url(#soft2)"/>
    <path d="M-430 0 A 430 104 0 0 0 430 0" fill="none" stroke="#8b5cf6" stroke-width="4" opacity=".55"/>
  </g>

  <ellipse cx="800" cy="760" rx="300" ry="30" fill="#a855f7" opacity=".16" filter="url(#soft2)"/>
  <rect width="1600" height="900" fill="url(#vig)"/>
</svg>

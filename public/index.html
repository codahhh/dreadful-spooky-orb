<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="application-name" content="Windows Browser">
<title>Windows Browser — Windows 10 in your browser</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%230078d7' d='M2 4.9l8.6-1.2v8.2H2V4.9zm0 14.2v-7.1h8.6v8.2L2 19.1zM11.6 3.7L22 2.2v9.6h-10.4V3.7zm0 16.6V12.8H22v9.5l-10.4-2z'/%3E%3C/svg%3E">
<meta name="description" content="Windows 10 rebuilt as a complete desktop environment in the browser: window manager, Start menu, File Explorer, Notepad, Paint, Settings, terminal and more.">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="theme/base.css">
<link rel="stylesheet" href="theme/shell.css">
<link rel="stylesheet" href="theme/apps.css">
<link rel="stylesheet" href="theme/mobile.css">
</head>
<body class="light">
<div id="screen">

  <!-- ================= WALLPAPER ================= -->
  <div id="wallpaper">
    <div class="wp-layer" id="wp-a"></div>
    <div class="wp-layer" id="wp-b"></div>
  </div>

  <!-- ================= DESKTOP ================= -->
  <div id="desktop" tabindex="0">
    <div id="desktop-icons"></div>
    <div id="desktop-marquee"></div>
  </div>

  <!-- ================= WINDOWS ================= -->
  <div id="windows"></div>
  <div id="snap-preview" hidden></div>
  <div id="snap-assist" hidden>
    <div class="snap-col" data-zone="left"></div>
    <div class="snap-col" data-zone="right"></div>
    <div class="snap-row"><div class="snap-cell" data-zone="tl"></div><div class="snap-cell" data-zone="tr"></div><div class="snap-cell" data-zone="bl"></div><div class="snap-cell" data-zone="br"></div></div>
  </div>

  <!-- ================= TASKBAR ================= -->
  <div id="taskbar">
    <div class="tb-left">
      <button id="start-btn" class="tb-btn tb-start" title="Start" aria-label="Start">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M3 5.6l7.6-1v7.1H3V5.6zm0 12.8v-6.2h7.6v7.1L3 18.4zm8.6 1.2V11.6H21v8.6l-9.4-0.6zM11.6 4.4L21 3v8.6h-9.4V4.4z"/></svg>
      </button>
      <button id="search-btn" class="tb-search" title="Search">
        <svg viewBox="0 0 24 24" width="17" height="17"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M10.5 4a6.5 6.5 0 1 0 4.2 11.5L20 21"/></svg>
        <span class="tb-search-text">Search the web and Windows</span>
        <svg class="tb-mic" viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3zm7 9a7 7 0 0 1-6 6.9V21h-2v-2.1A7 7 0 0 1 5 12h2a5 5 0 0 0 10 0h2z"/></svg>
      </button>
      <button id="taskview-btn" class="tb-btn" title="Task view (Win+Tab)">
        <svg viewBox="0 0 24 24" width="19" height="19"><rect x="2" y="5" width="12" height="10" rx="1" fill="none" stroke="currentColor" stroke-width="1.7"/><rect x="10" y="9" width="12" height="10" rx="1" fill="currentColor" opacity=".92"/></svg>
      </button>
    </div>

    <div id="tasks"></div>

    <div id="tray">
      <button id="tray-icons" class="tray-btn" title="Show hidden icons">
        <svg viewBox="0 0 24 24" width="15" height="15"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M6 14l6-6 6 6"/></svg>
      </button>
      <button id="tray-net" class="tray-btn" title="Network">
        <svg viewBox="0 0 24 24" width="17" height="17"><path fill="currentColor" d="M12 19.5a1.6 1.6 0 1 1 0-3.2 1.6 1.6 0 0 1 0 3.2zM6.8 12.7a7.3 7.3 0 0 1 10.4 0l-1.6 1.6a5 5 0 0 0-7.2 0l-1.6-1.6zM3.4 9.3a12 12 0 0 1 17.2 0l-1.6 1.6a9.8 9.8 0 0 0-14 0L3.4 9.3z"/></svg>
      </button>
      <button id="tray-vol" class="tray-btn" title="Speakers: 100%">
        <svg viewBox="0 0 24 24" width="17" height="17"><path fill="currentColor" d="M4 9.5h3.2L12 5.4v13.2L7.2 14.5H4zM15 8.6a5 5 0 0 1 0 6.8M17.7 6a8.5 8.5 0 0 1 0 12"/><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" d="M15 8.8a4.7 4.7 0 0 1 0 6.4M17.6 6.3a8 8 0 0 1 0 11.4"/></svg>
      </button>
      <button id="tray-battery" class="tray-btn" title="Battery: 92%">
        <svg viewBox="0 0 26 24" width="19" height="19"><rect x="2.5" y="7" width="18" height="10" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="4.2" y="8.8" width="14" height="6.4" fill="currentColor"/><rect x="21.6" y="10" width="1.8" height="4" rx=".8" fill="currentColor"/></svg>
      </button>
      <button id="clock" title="Date and time">
        <span id="clock-time">--:--</span>
        <span id="clock-date">--/--/----</span>
      </button>
      <button id="notif-btn" class="tray-btn" title="Action center (Win+A)">
        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M4 6h16v9H9l-5 4z"/><path stroke="currentColor" stroke-width="1.6" stroke-linecap="round" d="M8 9.5h8M8 12h5"/></svg>
      </button>
      <button id="tray-lang" class="tray-btn lang" title="English (United States)">ENG</button>
      <button id="tray-showdesk" title="Show desktop (Win+D)" aria-label="Show desktop"></button>
    </div>
  </div>

  <!-- ================= OVERLAYS ================= -->
  <div id="start-menu" class="panel" hidden></div>
  <div id="search-panel" class="panel" hidden></div>
  <div id="action-center" class="panel flyout-right" hidden></div>
  <div id="calendar-flyout" class="panel flyout-right" hidden></div>
  <div id="task-view" class="overlay" hidden></div>
  <div id="tray-flyout" class="panel" hidden></div>
  <div id="context-menu" class="menu" hidden></div>
  <div id="toast-host"></div>
  <div id="lockscreen" class="overlay-screen">
    <div class="lock-bg"></div>
    <div class="lock-content">
      <div id="lock-clock"></div>
      <div id="lock-date"></div>
      <div id="lock-hint">Click anywhere to sign in</div>
    </div>
    <div class="signin" id="signin" hidden>
      <div class="avatar" id="signin-avatar">A</div>
      <div class="signin-name" id="signin-name">Alex</div>
      <div class="signin-box">
        <input id="signin-pass" type="password" placeholder="Password" autocomplete="off" spellcheck="false">
        <button id="signin-go" title="Sign in">&#8594;</button>
      </div>
      <div class="signin-sub">Press Enter to sign in &mdash; any password works</div>
    </div>
  </div>
  <div id="shutdown-screen" hidden>
    <div class="sd-logo">
      <svg viewBox="0 0 24 24" width="46" height="46"><path fill="#fff" d="M3 5.6l7.6-1v7.1H3V5.6zm0 12.8v-6.2h7.6v7.1L3 18.4zm8.6 1.2V11.6H21v8.6l-9.4-0.6zM11.6 4.4L21 3v8.6h-9.4V4.4z"/></svg>
    </div>
    <div class="sd-text">Shutting down</div>
    <div class="win-spinner"><span></span><span></span><span></span><span></span><span></span></div>
  </div>
</div>
<script type="module" src="app/main.js"></script>
</body>
</html>
